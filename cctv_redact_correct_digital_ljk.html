<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Redact & Correct - Digital Answer Sheet</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#0b0f19',
              card: '#1e293b',
              border: '#334155',
              neonRed: '#f43f5e',
              neonGreen: '#4ade80',
              neonBlue: '#38bdf8',
              neonYellow: '#fbbf24',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Cyberpunk glow effects */
    .glow-red {
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
    }
    .glow-blue {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }
    .focus-glow:focus-within {
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
      border-color: #4ade80 !important;
    }

    /* Print styles for Save as PDF */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      .no-print {
        display: none !important;
      }
      .print-card {
        background: #ffffff !important;
        border: 1px solid #94a3b8 !important;
        color: #000000 !important;
        box-shadow: none !important;
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 12px !important;
        padding: 12px !important;
      }
      .print-title {
        color: #0f172a !important;
      }
      .print-header {
        border-bottom: 2px solid #0f172a !important;
        margin-bottom: 16px !important;
        padding-bottom: 8px !important;
      }
      input, textarea {
        background: #f8fafc !important;
        color: #000000 !important;
        border: 1px solid #cbd5e1 !important;
      }
      .print-tag {
        background-color: #e2e8f0 !important;
        color: #0f172a !important;
        border: 1px solid #94a3b8 !important;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-24 font-sans antialiased">

  <!-- TOP STICKY BAR: PROGRESS & QUICK ACTION -->
  <header class="no-print sticky top-0 z-50 bg-[#0b0f19]/90 backdrop-blur-md border-b border-cyber-border px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-cyber-neonRed text-xl"></i>
        <span class="font-mono font-bold text-sm sm:text-base tracking-wide text-white">CCTV WORKSHEET DIGITAL</span>
      </div>
      <!-- Progress Bar Tracker -->
      <div class="flex-1 max-w-[180px] sm:max-w-xs">
        <div class="flex justify-between text-xs font-mono text-gray-400 mb-1">
          <span>PROGRESS</span>
          <span id="progress-text" class="text-cyber-neonGreen font-bold">0/20</span>
        </div>
        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
          <div id="progress-bar" class="bg-gradient-to-r from-cyber-neonBlue via-cyber-neonGreen to-cyber-neonYellow h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-6">

    <!-- HEADER TITLE & IDENTITY CARD -->
    <section class="print-header bg-cyber-card border border-cyber-border rounded-2xl p-5 mb-6 glow-red">
      <div class="flex items-center gap-3 mb-2">
        <span class="print-tag bg-rose-950/80 text-cyber-neonRed border border-rose-800 text-xs font-mono font-bold px-3 py-1 rounded-full uppercase tracking-wider">
          <i class="fa-solid fa-[#f43f5e] fa-video mr-1"></i> EVIDENCE REDACTION SHEET
        </span>
      </div>
      <h1 class="print-title text-2xl sm:text-3xl font-extrabold font-mono text-white mb-2">
        CCTV REDACT & CORRECT
      </h1>
      <p class="text-xs sm:text-sm text-slate-300 mb-5 leading-relaxed">
        Analyze the following 20 pieces of CCTV recording evidence. Provide grammatically correct revisions for the sentences—ensuring they are 100% accurate—and explain the reasoning behind each correction.
      </p>

      <!-- STUDENT IDENTITY INPUTS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-700/80 pt-4">
        <div>
          <label class="block text-xs font-mono text-cyber-neonBlue mb-1 font-semibold uppercase">
            <i class="fa-solid fa-user-ninja mr-1"></i> Student Name
          </label>
          <input type="text" id="student-name" placeholder="Ketik nama lengkap..." 
                 class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-cyber-neonBlue transition">
        </div>
        <div>
          <label class="block text-xs font-mono text-cyber-neonBlue mb-1 font-semibold uppercase">
            <i class="fa-solid fa-id-badge mr-1"></i> ID No.
          </label>
          <input type="text" id="student-id" placeholder="Contoh: Desk 04 - Pair A" 
                 class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-cyber-neonBlue transition">
        </div>
      </div>
    </section>

    <!-- FORM QUESTIONNAIRE CONTAINER -->
    <form id="ljk-form" class="space-y-5">
      <!-- 20 Question Cards will be injected via JS -->
    </form>

  </main>

  <!-- BOTTOM FLOATING ACTION BAR (Print & Send WA) -->
  <div class="no-print fixed bottom-0 left-0 right-0 bg-[#0b0f19]/95 border-t border-cyber-border p-3 z-50 backdrop-blur-md">
    <div class="max-w-3xl mx-auto flex flex-col sm:flex-row gap-2 sm:gap-3">
      <!-- Print/Save PDF Button -->
      <button type="button" onclick="window.print()" 
              class="flex-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-mono text-xs sm:text-sm font-bold py-3 px-4 rounded-xl border border-slate-600 flex items-center justify-center gap-2 transition">
        <i class="fa-solid fa-file-pdf text-cyber-neonRed text-base"></i>
        <span>Simpan PDF / Print</span>
      </button>

      <!-- Send to WhatsApp Button -->
      <button type="button" onclick="sendToWhatsApp()" 
              class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-mono text-xs sm:text-sm font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-900/40 flex items-center justify-center gap-2 transition">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Kirim Hasil ke WA Guru</span>
      </button>
    </div>
  </div>

  <script>
    // Data 20 Soal CCTV Redact & Correct
    const questions = [
      { id: 1, level: "Level 1", original: "John usually mops the floor, but right now he mop the server room." },
      { id: 2, level: "Level 1", original: "She is drive a sports car every single morning." },
      { id: 3, level: "Level 2", original: "Look at camera 3! The suspect opening the safe right now." },
      { id: 4, level: "Level 2", original: "The guard is checking all windows at midnight every night." },
      { id: 5, level: "Level 3", original: "Agent 007 is runing out of the building at this moment." },
      { id: 6, level: "Level 3", original: "The hacker is deleteing secret files from the main server." },
      { id: 7, level: "Level 4", original: "The Master Chef don't cooking soup right now; he is slicing meat." },
      { id: 8, level: "Level 4", original: "The suspect isn't steal money on Mondays; he robs banks on Fridays." },
      { id: 9, level: "Level 5", original: "Detective Miller is wearing always a bulletproof vest." },
      { id: 10, level: "Level 5", original: "Right now, the bank robber usually disables the alarm." },
      { id: 11, level: "Level 6 (Trap)", original: "Look! The suspect is wanting to escape through the window!" },
      { id: 12, level: "Level 6 (Trap)", original: "The thief is knowing the password for the vault right now." },
      { id: 13, level: "Level 7 (Trap)", original: "At 2 PM, the driver is liking to speed past security gates." },
      { id: 14, level: "Level 7 (Trap)", original: "The officer is believing that the robber is still inside." },
      { id: 15, level: "Level 8 (Trap)", original: "These days, the suspect is wearing a mask to work every day." },
      { id: 16, level: "Level 8 (Trap)", original: "Currently, the hacker changes passwords every three hours." },
      { id: 17, level: "Level 9 (Dual)", original: "The intruder is climbing the fence and run toward the helicopter right now." },
      { id: 18, level: "Level 9 (Dual)", original: "She usually drives fast and is parking near the alley." },
      { id: 19, level: "Level 10 (Master)", original: "While the security guard sleeps, the thief steals the diamond right now." },
      { id: 20, level: "Level 10 (Master)", original: "Listen! The alarm is ringing because someone tries to open the safe!" }
    ];

    // Render questions on page load
    const formContainer = document.getElementById('ljk-form');
    
    questions.forEach((q) => {
      const card = document.createElement('div');
      card.className = "print-card bg-cyber-card border border-cyber-border rounded-2xl p-4 sm:p-5 transition focus-glow";
      card.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-2">
          <span class="print-tag text-xs font-mono font-bold px-2.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-cyber-neonBlue">
            LOG #${q.id < 10 ? '0' + q.id : q.id}
          </span>
          <span class="text-[11px] font-mono text-slate-400 uppercase">${q.level}</span>
        </div>

        <!-- Evidence Original Box -->
        <div class="bg-slate-900/90 border-l-4 border-rose-500 rounded-r-xl p-3 mb-3">
          <p class="text-[11px] font-mono text-rose-400 font-bold mb-0.5">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> EVIDENCE LOG (ERROR):
          </p>
          <p class="text-sm font-medium text-slate-200 italic font-mono">"${q.original}"</p>
        </div>

        <!-- Student Answer Inputs -->
        <div class="space-y-2.5">
          <div>
            <label class="block text-[11px] font-mono text-cyber-neonGreen font-semibold mb-1 uppercase">
              <i class="fa-solid fa-check-double mr-1"></i> Corrected Sentence:
            </label>
            <input type="text" id="ans-${q.id}" oninput="updateProgress()" 
                   placeholder="Ketik kalimat perbaikan di sini..."
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyber-neonGreen transition">
          </div>
          <div>
            <label class="block text-[11px] font-mono text-cyber-neonYellow font-semibold mb-1 uppercase">
              <i class="fa-solid fa-comment-dots mr-1"></i> Reason / Rule Explanation:
            </label>
            <input type="text" id="reason-${q.id}" oninput="updateProgress()" 
                   placeholder="Alasan (contoh: 'right now' butuh '-ing'...) "
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-slate-300 placeholder-slate-500 focus:outline-none focus:border-cyber-neonYellow transition">
          </div>
        </div>
      `;
      formContainer.appendChild(card);
    });

    // Update Progress Bar Counter
    function updateProgress() {
      let filledCount = 0;
      questions.forEach(q => {
        const ans = document.getElementById(`ans-${q.id}`).value.trim();
        if (ans.length > 0) filledCount++;
      });
      
      const percentage = (filledCount / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${percentage}%`;
      document.getElementById('progress-text').innerText = `${filledCount}/${questions.length}`;
    }

    // Format & Send Answers to WhatsApp
    function sendToWhatsApp() {
      const name = document.getElementById('student-name').value.trim() || 'Siswa Tanpa Nama';
      const studentId = document.getElementById('student-id').value.trim() || 'No Desk ID';

      let message = `*CCTV REDACT & CORRECT - ANSWER SHEET*\n`;
      message += `👤 *Nama:* ${name}\n`;
      message += `📌 *Desk/Group:* ${studentId}\n`;
      message += `==============================\n\n`;

      let answeredCount = 0;

      questions.forEach(q => {
        const ans = document.getElementById(`ans-${q.id}`).value.trim();
        const reason = document.getElementById(`reason-${q.id}`).value.trim();
        
        if (ans !== '') {
          answeredCount++;
          message += `*Log #${q.id}:*\n`;
          message += `✅ *Fix:* ${ans}\n`;
          if (reason !== '') {
            message += `💡 *Reason:* ${reason}\n`;
          }
          message += `\n`;
        }
      });

      if (answeredCount === 0) {
        alert("Harap isi setidaknya 1 jawaban sebelum mengirim ke WhatsApp!");
        return;
      }

      // Encode URL for WhatsApp link
      const encodedMsg = encodeURIComponent(message);
      const waUrl = `https://wa.me/?text=${encodedMsg}`;

      // Open WhatsApp App / Web
      window.open(waUrl, '_blank');
    }
  </script>
</body>
</html>
